<!DOCTYPE html>
<html>
<head>
<title>Vehicle Prediction</title>

<style>

body{
font-family:Segoe UI;
background:#f4f6f8;
padding:40px;
position:static;
}

.container{
max-width:600px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
position:relative;
}

h2{
text-align:center;
margin-bottom:20px;
color:#0d6efd;
}

label{
font-weight:600;
display:block;
margin-top:10px;
}

.range{
color:gray;
font-weight:normal;
font-size:14px;
}

input,select{
width:100%;
padding:10px;
margin:6px 0 12px 0;
border-radius:6px;
border:1px solid #ccc;
}

/* Hide number input spinners to prevent scroll changes */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield;
  appearance: textfield;
}

button{
width:100%;
padding:12px;
background:#0d6efd;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#084298;
}

.back{
text-decoration:none;
color:#0d6efd;
font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<a href="/" class="back">← Back to Home</a>

<h2>Vehicle Health Prediction</h2>

<form action="/predict" method="post" autocomplete="off">

<label>Vehicle Type</label>
<select name="Vehicle_Type" required>
<option>Hatchback</option>
<option>Sedan</option>
<option>SUV</option>
<option>Truck</option>
</select>

<label>Vehicle Age <span class="range">(0 – 15 years)</span></label>
<input type="number" name="Vehicle_Age" required>

<label>Mileage <span class="range">(0 – 350000 km)</span></label>
<input type="number" name="Mileage" required>

<label>Engine Temperature <span class="range">(88 – 110 °C)</span></label>
<input type="number" name="Engine_Temp" required>

<label>RPM <span class="range">(1500 – 3000)</span></label>
<input type="number" name="RPM" required>

<label>Oil Pressure <span class="range">(25 – 45 PSI)</span></label>
<input type="number" name="Oil_Pressure" required>

<label>Fuel Consumption <span class="range">(5 – 20 km/l)</span></label>
<input type="number" step="0.1" name="Fuel_Consumption" required>

<label>Battery Voltage <span class="range">(11 – 13 V)</span></label>
<input type="number" step="0.01" name="Battery_Voltage" required>

<label>Brake Pressure <span class="range">(30 – 45)</span></label>
<input type="number" name="Brake_Pressure" required>

<label>Tire Pressure <span class="range">(30 – 110 PSI)</span></label>
<input type="number" name="Tire_Pressure" required>

<label>Tire Condition</label>
<select name="Tire_Condition">
<option>Good</option>
<option>Moderate</option>
<option>Worn</option>
<option>Critical</option>
</select>

<label>Vibration Level</label>
<select name="Vibration_Level">
<option>Low</option>
<option>Medium</option>
<option>High</option>
</select>

<label>Months Since Last Service <span class="range">(1 – 12)</span></label>
<input type="number" name="Last_Service_Months" required>

<label>Accident History</label>
<select name="Accident_History">
<option>No</option>
<option>Yes</option>
</select>

<button type="submit">Predict Remaining KM</button>

</form>

</div>

<script>
// Comprehensive fix to prevent input value changes on scroll
document.addEventListener('DOMContentLoaded', function() {
    const formFields = document.querySelectorAll('input, select');
    
    // Disable autocomplete
    formFields.forEach(field => {
        field.setAttribute('autocomplete', 'off');
    });
    
    // Prevent input from changing on mouse wheel/scroll
    formFields.forEach(field => {
        field.addEventListener('wheel', function(e) {
            if (this.type === 'number') {
                e.preventDefault();
                return false;
            }
        }, {passive: false});
        
        // Also prevent arrow key increments in number inputs
        field.addEventListener('keydown', function(e) {
            if (this.type === 'number' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
                e.preventDefault();
            }
        });
    });
});
</script>

</body>
</html>
