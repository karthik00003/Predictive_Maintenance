<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Signup</title>

<!-- AngularJS CDN -->
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* VIDEO BACKGROUND */
.video-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

.video-bg video{
width:100%;
height:100%;
object-fit:cover;
}

/* OVERLAY */
.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
}

/* FORM BOX */
.form-box{
width:420px;
padding:50px 40px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(20px);
border-radius:20px;
color:white;
text-align:center;
perspective:1000px;
animation: float 4s ease-in-out infinite;
}

/* FLOAT */
@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

/* FLIP BOX */
.flip-box{
position:relative;
width:100%;
height:320px;
transform-style:preserve-3d;
transition: transform 1s ease-in-out;
}

.flip{
transform:rotateY(180deg);
}

/* FORMS */
.form{
position:absolute;
width:100%;
top:0;
left:0;
backface-visibility:hidden;
}

.signup{
transform:rotateY(180deg);
}

/* TITLE */
h2{
margin-bottom:20px;
}

/* INPUTS */
.input-box{
margin:15px 0;
}

.input-box input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:rgba(255,255,255,0.2);
color:white;
outline:none;
}

.input-box input::placeholder{
color:#ddd;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#00c6ff;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#0072ff;
}

/* TOGGLE */
.toggle{
margin-top:15px;
font-size:14px;
cursor:pointer;
color:#ccc;
}

.toggle span{
color:#00c6ff;
font-weight:bold;
}
</style>
</head>

<body ng-controller="myCtrl">

<!-- VIDEO -->
<div class="video-bg">
<video autoplay muted loop>
<source src="../static/bg.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
</div>

<!-- FORM -->
<div class="form-box">

<div class="flip-box" ng-class="{'flip': isFlipped}">

<!-- LOGIN -->
<div class="form login">
<form ng-submit="handleLogin()" name="loginForm">
	<h2>Login</h2>

	<div ng-if="loginError" style="color: #ff4d4d; margin-bottom: 10px; font-weight: bold;">{% raw %}{{ loginError }}{% endraw %}</div>

	<div class="input-box">
		<input type="text" name="username" placeholder="Email" ng-model="loginUsername" required>
	</div>

	<div class="input-box">
		<input type="password" name="password" placeholder="Password" ng-model="loginPassword" required>
	</div>

	<button type="submit" ng-disabled="isLoggingIn">{% raw %}{{ isLoggingIn ? 'Logging in...' : 'Login' }}{% endraw %}</button>
</form>

<p class="toggle" ng-click="toggleForm()">Don't have an account? <span>Sign Up</span></p>
</div>

<!-- SIGNUP -->
<div class="form signup">
<form ng-submit="handleSignup()" name="signupForm">
<h2>Sign Up</h2>

<div ng-if="signupError" style="color: #ff4d4d; margin-bottom: 10px; font-weight: bold;">{% raw %}{{ signupError }}{% endraw %}</div>

<div class="input-box">
<input type="email" name="username" placeholder="Email" ng-model="signupUsername" required>
</div>

<div class="input-box">
<input type="password" name="password" placeholder="Password" ng-model="signupPassword" required>
</div>

<button type="submit" ng-disabled="isSigningUp">{% raw %}{{ isSigningUp ? 'Creating...' : 'Create Account' }}{% endraw %}</button>
</form>

<p class="toggle" ng-click="toggleForm()">Already have an account? <span>Login</span></p>
</div>

</div>

</div>

<script>
angular.module("myApp", [])
.controller("myCtrl", function($scope, $http){

$scope.isFlipped = false;
$scope.loginError = null;
$scope.isLoggingIn = false;
$scope.signupError = null;
$scope.isSigningUp = false;

$scope.toggleForm = function(){
$scope.isFlipped = !$scope.isFlipped;
};

$scope.handleLogin = function(){
	if (!$scope.loginUsername || !$scope.loginPassword) {
		$scope.loginError = "Please fill in all fields";
		return;
	}

	$scope.isLoggingIn = true;
	$scope.loginError = null;

	// Serialize form data
	var formData = 'username=' + encodeURIComponent($scope.loginUsername) + 
	               '&password=' + encodeURIComponent($scope.loginPassword);

	$http({
		method: 'POST',
		url: '/login',
		data: formData,
		headers: {
			'Content-Type': 'application/x-www-form-urlencoded',
			'X-Requested-With': 'XMLHttpRequest'
		}
	}).then(function(response) {
		// Success - redirect to home
		window.location.href = response.data.redirect;
	}, function(error) {
		// Error - show error message
		$scope.loginError = error.data.error || 'Login failed';
		$scope.isLoggingIn = false;
	});
};

$scope.handleSignup = function(){
	if (!$scope.signupUsername || !$scope.signupPassword) {
		$scope.signupError = "Please fill in all fields";
		return;
	}

	$scope.isSigningUp = true;
	$scope.signupError = null;

	// Serialize form data
	var formData = 'username=' + encodeURIComponent($scope.signupUsername) + 
	               '&password=' + encodeURIComponent($scope.signupPassword);

	$http({
		method: 'POST',
		url: '/signup',
		data: formData,
		headers: {
			'Content-Type': 'application/x-www-form-urlencoded',
			'X-Requested-With': 'XMLHttpRequest'
		}
	}).then(function(response) {
		// Success - redirect to home
		window.location.href = response.data.redirect;
	}, function(error) {
		// Error - show error message
		$scope.signupError = error.data.error || 'Signup failed';
		$scope.isSigningUp = false;
	});
};

});
</script>

</body>
</html>
